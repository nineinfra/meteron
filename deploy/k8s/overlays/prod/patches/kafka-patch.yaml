# prod overlay: Kafka 生产高配
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: meteron
spec:
  template:
    spec:
      containers:
        - name: kafka
          resources:
            requests:
              cpu: 1000m
              memory: 4Gi
            limits:
              cpu: 6000m
              memory: 16Gi
  volumeClaimTemplates:
    - metadata:
        name: kafkadata
      spec:
        resources:
          requests:
            storage: 200Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  namespace: meteron
data:
  KAFKA_NUM_IO_THREADS: "16"
  KAFKA_NUM_NETWORK_THREADS: "8"
  KAFKA_SOCKET_SEND_BUFFER_BYTES: "1048576"
  KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: "1048576"
  KAFKA_LOG_RETENTION_HOURS: "720"
  KAFKA_LOG_SEGMENT_BYTES: "1073741824"
  KAFKA_MESSAGE_MAX_BYTES: "10485760"
  KAFKA_REPLICA_FETCH_MAX_BYTES: "10485760"
