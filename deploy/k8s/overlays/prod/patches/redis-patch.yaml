# prod overlay: Redis 生产高配
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: meteron
spec:
  template:
    spec:
      containers:
        - name: redis
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
  volumeClaimTemplates:
    - metadata:
        name: redisdata
      spec:
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: meteron
data:
  REDIS_MAXMEMORY: "2gb"
  REDIS_REPL_BACKLOG_SIZE: "128mb"
