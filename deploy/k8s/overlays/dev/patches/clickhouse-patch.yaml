# dev overlay: ClickHouse 降配
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: meteron
spec:
  template:
    spec:
      containers:
        - name: clickhouse
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 4Gi
  volumeClaimTemplates:
    - metadata:
        name: chdata
      spec:
        resources:
          requests:
            storage: 20Gi
