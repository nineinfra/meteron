# ClickHouse HA: 3 副本 + 内嵌 Keeper（Raft 共识）
# 并发/内存/线程参数全部通过 ConfigMap 注入，overlay 可覆盖

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-config
  namespace: meteron
  labels:
    app: clickhouse
data:
  init-keeper-id.sh: |
    #!/bin/sh
    set -e
    ORDINAL=$(hostname | awk -F'-' '{print $NF}')
    KEEPER_ID=$((ORDINAL + 1))
    echo "$KEEPER_ID" > /var/lib/clickhouse-keeper/myid
    echo "Keeper ID: $KEEPER_ID"
  server_config.xml: |
    <clickhouse>
      <tcp_port>9000</tcp_port>
      <http_port>8123</http_port>
      <interserver_http_port>9009</interserver_http_port>
      <listen_host>0.0.0.0</listen_host>

      <max_connections>4096</max_connections>
      <max_concurrent_queries>200</max_concurrent_queries>
      <max_memory_usage>10000000000</max_memory_usage>
      <max_memory_usage_for_user>5000000000</max_memory_usage_for_user>
      <max_threads>8</max_threads>
      <max_block_size>65536</max_block_size>
      <max_insert_block_size>1048576</max_insert_block_size>
      <max_query_size>262144</max_query_size>
      <max_parser_depth>1000</max_parser_depth>
      <max_ast_depth>1000</max_ast_depth>
      <max_result_rows>0</max_result_rows>
      <max_result_bytes>0</max_result_bytes>
      <uncompressed_cache_size>8589934592</uncompressed_cache_size>
      <mark_cache_size>5368709120</mark_cache_size>
      <mmap_cache_size>1000</mmap_cache_size>
      <max_open_files>262144</max_open_files>
      <merge_tree>
        <max_replicated_logs_to_keep>1000</max_replicated_logs_to_keep>
        <max_replicated_merges_in_queue>16</max_replicated_merges_in_queue>
        <max_replicated_mutations_in_queue>8</max_replicated_mutations_in_queue>
        <parts_to_delay_insert>150</parts_to_delay_insert>
        <parts_to_throw_insert>300</parts_to_throw_insert>
      </merge_tree>

      <keeper_server>
        <tcp_port>9181</tcp_port>
        <server_id_file>/var/lib/clickhouse-keeper/myid</server_id_file>
        <log_storage_path>/var/lib/clickhouse-keeper/logs</log_storage_path>
        <snapshot_storage_path>/var/lib/clickhouse-keeper/snapshots</snapshot_storage_path>
        <coordination_settings>
          <operation_timeout_ms>10000</operation_timeout_ms>
          <session_timeout_ms>30000</session_timeout_ms>
        </coordination_settings>
        <raft_configuration>
          <server><id>1</id><hostname>clickhouse-0.clickhouse-headless.meteron.svc.cluster.local</hostname><port>9234</port></server>
          <server><id>2</id><hostname>clickhouse-1.clickhouse-headless.meteron.svc.cluster.local</hostname><port>9234</port></server>
          <server><id>3</id><hostname>clickhouse-2.clickhouse-headless.meteron.svc.cluster.local</hostname><port>9234</port></server>
        </raft_configuration>
      </keeper_server>

      <zookeeper>
        <node><host>clickhouse-0.clickhouse-headless.meteron.svc.cluster.local</host><port>9181</port></node>
        <node><host>clickhouse-1.clickhouse-headless.meteron.svc.cluster.local</host><port>9181</port></node>
        <node><host>clickhouse-2.clickhouse-headless.meteron.svc.cluster.local</host><port>9181</port></node>
        <session_timeout_ms>30000</session_timeout_ms>
        <operation_timeout_ms>10000</operation_timeout_ms>
      </zookeeper>

      <distributed_ddl>
        <path>/clickhouse/task_queue/ddl</path>
      </distributed_ddl>

      <macros>
        <shard>01</shard>
        <replica_from_env>HOSTNAME</replica_from_env>
      </macros>
    </clickhouse>
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse-headless
  namespace: meteron
  labels:
    app: clickhouse
spec:
  clusterIP: None
  selector:
    app: clickhouse
  ports:
    - name: tcp-ch
      port: 9000
    - name: http-ch
      port: 8123
    - name: keeper
      port: 9181
    - name: keeper-raft
      port: 9234
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: meteron
  labels:
    app: clickhouse
spec:
  selector:
    app: clickhouse
  ports:
    - name: tcp-ch
      port: 9000
    - name: http-ch
      port: 8123
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: meteron
  labels:
    app: clickhouse
spec:
  serviceName: clickhouse-headless
  replicas: 3
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      initContainers:
        - name: init-keeper-id
          image: clickhouse/clickhouse-server:24.3-alpine
          command: ['/bin/sh', '/config/init-keeper-id.sh']
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: keeperdata
              mountPath: /var/lib/clickhouse-keeper
            - name: config
              mountPath: /config
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.3-alpine
          env:
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: clickhouse-secret
                  key: CLICKHOUSE_USER
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-secret
                  key: CLICKHOUSE_PASSWORD
            - name: CLICKHOUSE_DB
              valueFrom:
                secretKeyRef:
                  name: clickhouse-secret
                  key: CLICKHOUSE_DB
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
          ports:
            - containerPort: 9000
              name: tcp-ch
            - containerPort: 8123
              name: http-ch
            - containerPort: 9181
              name: keeper-client
            - containerPort: 9234
              name: keeper-raft
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: 4000m
              memory: 16Gi
          volumeMounts:
            - name: chdata
              mountPath: /var/lib/clickhouse
            - name: keeperdata
              mountPath: /var/lib/clickhouse-keeper
            - name: config
              mountPath: /etc/clickhouse-server/config.d/ha.xml
              subPath: server_config.xml
          readinessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: clickhouse-config
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: chdata
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 50Gi
    - metadata:
        name: keeperdata
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 5Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: clickhouse-pdb
  namespace: meteron
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: clickhouse
