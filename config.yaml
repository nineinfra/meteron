# Meteron 配置样例（本地开发默认值）
# 优先级：默认值 < 本文件 < 环境变量（METERON_*）
# Docker 部署见 deploy/docker-compose.yml（全部通过环境变量注入）

server:
  addr: ":9080"         # API/网关端点（/v1 /api/v1 /metrics）
  console_addr: ":8080" # Web 控制台端点（UI + 反代 API，置空禁用）

pg_dsn: "host=localhost port=5432 user=meteron password=meteron123 dbname=meteron sslmode=disable"
clickhouse_dsn: "clickhouse://meteron:meteron123@localhost:9000/meteron"
kafka_brokers:
  - "localhost:9092"
kafka_topic: "meteron.meter-events"
redis_addr: "localhost:6379"

# 32字节 hex（64字符）。API Key 哈希（HMAC-SHA256）的 pepper，生产环境务必更换并妥善保管
aes_key: "000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f"
# 首次启动引导 API Key（明文，仅初始化用；生产环境启动后应轮换）
bootstrap_api_key: "mk_meteron_bootstrap_dev_key"

providers:
  # 默认模型：本地 Ollama 的 qwen3.5:9b（先 ollama pull qwen3.5:9b）
  - name: ollama
    type: local
    base_url: "http://localhost:11434/v1"
    models: ["qwen3.5:9b"]
  - name: mock
    type: mock
    models:
      - mock-chat
      - mock-cheap
  # - name: vllm
  #   type: local
  #   base_url: "http://localhost:8000/v1"
  #   models: ["qwen2.5-72b"]
  # - name: openai-main
  #   type: openai
  #   base_url: "https://api.openai.com/v1"
  #   api_key: "${OPENAI_API_KEY}"
  #   models: ["gpt-4o", "gpt-4o-mini"]
  # - name: anthropic-main
  #   type: anthropic
  #   base_url: "https://api.anthropic.com"
  #   api_key: "${ANTHROPIC_API_KEY}"
  #   models: ["claude-sonnet-4-5", "claude-haiku-4-5"]

business:
  event_lookback_window_days: 34   # 晚到事件回溯窗口
  reserve_default_ttl_seconds: 60  # 预算预留 TTL（LLM 超时兜底）
  estimate_unit_price: "0.000002"  # reserve 预估单价（每 token）
  estimate_default_max_tokens: 1024
  estimate_chars_per_token: 4
  scheduled_interval: 10s          # 过期预留扫描间隔
  resync_interval: 1h              # Redis-PG 缓存漂移校正
  billing_interval: 0              # BillingRun 自动调度（0=仅手动触发）
  recon_light_interval: 1h         # 小时轻量对账
  recon_deep_interval: 24h         # 每日深度对账

# 双重限流（参考 sub2api）：客户维度 RPM/TPM/并发 + 上游 Provider 账号维度并发。
# 全部 0 = 不限制。Redis 滑动窗口实现；限流器故障时 fail-open 放行。
rate_limit:
  customer_rpm: 0            # 客户每分钟最大请求数
  customer_tpm: 0            # 客户每分钟最大 token 数（按输入估算+max_tokens）
  customer_max_concurrent: 0 # 客户最大并发请求数
  provider_max_concurrent: 0 # 上游渠道单账号最大并发（防止打爆上游触发限流）

# 渠道健康探测与自动降级（参考 new-api 渠道管理）。
# 窗口内错误率超阈值且样本数达标 → 自动禁用（路由切换 fallback，均不可用则拒绝）；
# 人工恢复：POST /api/v1/providers/{name}/enable（重置统计重新观察）。
health:
  probe_interval: 60s        # 主动探测间隔（GET base_url 连通性检查，不耗 token；0=关闭）
  window: 5m                 # 错误率统计滑动窗口
  error_rate_threshold: 0.5  # 自动禁用阈值（0~1，含真实流量与探测样本）
  min_samples: 10            # 触发自动禁用的最小样本数（防小样本误杀）
