<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" font-family="-apple-system,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <title>Meteron 内部数据流（实体与步骤）</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#6B7280"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563EB"/>
    </marker>
  </defs>

  <rect width="980" height="620" fill="#FFFFFF"/>

  <!-- ===== 实体：第 1 行（在线链路） ===== -->
  <rect x="24" y="40" width="110" height="60" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="79" y="75" text-anchor="middle" font-size="15" font-weight="600" fill="#1F2937">应用</text>

  <!-- Meteron：三框错位叠加表示多副本水平扩容 -->
  <rect x="282" y="52" width="200" height="60" rx="8" fill="#C7D2FE" stroke="#818CF8" stroke-width="1"/>
  <rect x="276" y="46" width="200" height="60" rx="8" fill="#E0E7FF" stroke="#818CF8" stroke-width="1"/>
  <rect x="270" y="40" width="200" height="60" rx="8" fill="#EEF2FF" stroke="#818CF8" stroke-width="1.5"/>
  <text x="370" y="64" text-anchor="middle" font-size="14" font-weight="600" fill="#3730A3">Meteron</text>
  <text x="370" y="86" text-anchor="middle" font-size="11" fill="#6B7280">网关 + 后台 Worker</text>
  <text x="370" y="30" text-anchor="middle" font-size="12" fill="#6B7280">×N 副本 · 无状态水平扩容</text>

  <rect x="610" y="40" width="346" height="60" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="783" y="66" text-anchor="middle" font-size="14" font-weight="600" fill="#166534">LLM Provider</text>
  <text x="783" y="88" text-anchor="middle" font-size="11" fill="#6B7280">（OpenAI / Anthropic / GLM / 本地 / mock）</text>

  <!-- ===== 实体：第 2 行（存储） ===== -->
  <rect x="24" y="300" width="140" height="60" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="94" y="325" text-anchor="middle" font-size="14" font-weight="600" fill="#991B1B">Redis</text>
  <text x="94" y="347" text-anchor="middle" font-size="11" fill="#6B7280">预算缓存 / 分布式锁</text>

  <rect x="214" y="300" width="140" height="60" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="284" y="325" text-anchor="middle" font-size="14" font-weight="600" fill="#991B1B">PostgreSQL</text>
  <text x="284" y="347" text-anchor="middle" font-size="11" fill="#6B7280">Outbox·账本·账单</text>

  <rect x="424" y="300" width="110" height="60" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="479" y="325" text-anchor="middle" font-size="14" font-weight="600" fill="#991B1B">Kafka</text>
  <text x="479" y="347" text-anchor="middle" font-size="11" fill="#6B7280">meter-events</text>

  <rect x="604" y="300" width="352" height="60" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="780" y="325" text-anchor="middle" font-size="14" font-weight="600" fill="#991B1B">ClickHouse</text>
  <text x="780" y="347" text-anchor="middle" font-size="11" fill="#6B7280">计量明细 + 小时预聚合</text>

  <!-- ===== 步骤箭头：在线链路（①③④ 同步） ===== -->
  <line x1="134" y1="66" x2="270" y2="66" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="200" y="56" text-anchor="middle" font-size="12" fill="#6B7280">① OpenAI 兼容请求</text>

  <line x1="482" y1="66" x2="610" y2="66" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="540" y="56" text-anchor="middle" font-size="12" fill="#6B7280">③ 转发请求</text>

  <line x1="610" y1="88" x2="482" y2="88" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="578" y="112" text-anchor="middle" font-size="12" fill="#6B7280">④ 响应 + usage 嗅探（SSE）</text>

  <!-- ===== 步骤箭头：网关 → 存储（②⑤ 异步） ===== -->
  <path d="M 310 112 V 200 H 94 V 300" stroke="#2563EB" stroke-width="1.5" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="202" y="190" text-anchor="middle" font-size="12" fill="#2563EB">② 预算预留（原子扣减）</text>

  <line x1="330" y1="112" x2="330" y2="300" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="342" y="190" font-size="12" fill="#2563EB">⑤ MeterEvent 落 Outbox</text>

  <!-- ===== 步骤箭头：存储间（⑥⑦） ===== -->
  <line x1="354" y1="330" x2="424" y2="330" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="389" y="290" text-anchor="middle" font-size="12" fill="#6B7280">⑥ relay 投递</text>

  <line x1="534" y1="330" x2="604" y2="330" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="569" y="290" text-anchor="middle" font-size="12" fill="#6B7280">⑦ Sink 落库</text>

  <!-- ===== 步骤箭头：出账与对账（⑧⑨ 异步，ClickHouse → PostgreSQL） ===== -->
  <path d="M 700 360 V 420 H 300 V 360" stroke="#2563EB" stroke-width="1.5" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="500" y="442" text-anchor="middle" font-size="12" fill="#2563EB">⑧ BillingRun 出账</text>

  <path d="M 860 360 V 480 H 250 V 360" stroke="#2563EB" stroke-width="1.5" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="555" y="502" text-anchor="middle" font-size="12" fill="#2563EB">⑨ 对账（差异→correction）</text>

  <!-- 图例 -->
  <g font-size="12" fill="#6B7280">
    <rect x="24" y="560" width="932" height="56" rx="8" fill="#F8FAFC"/>
    <text x="44" y="583" font-weight="600" fill="#374151">图例：</text>
    <line x1="96" y1="579" x2="140" y2="579" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="150" y="583">同步调用/转发</text>
    <line x1="260" y1="579" x2="304" y2="579" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
    <text x="314" y="583">异步事件/数据流</text>
    <text x="44" y="604">①–④ 在线链路（毫秒级）｜⑤–⑨ 由 Meteron 后台 Worker 执行，箭头为数据流向｜Meteron 三框叠加 = 多副本水平扩容</text>
  </g>
</svg>
